name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: Full check (Node ${{ matrix.node }}, Linux)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm test
            - run: npm run build
            - run: npm run test:package
              env:
                  REQUIRE_BROWSER: '1'
            - run: npm pack --dry-run

    cli-smoke:
        name: CLI smoke (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run test:cli
