name: Release

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org
            # Trusted publishing (OIDC) needs npm >= 11.5.1
            - run: npm install -g npm@latest
            - name: Check tag matches package.json version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "v$VERSION" ]; then
                    echo "Tag $TAG does not match package.json version v$VERSION" >&2
                    exit 1
                  fi
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm test
            - run: npm run test:package
              env:
                  REQUIRE_BROWSER: '1'
            - name: Publish
              env:
                  DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
                  # Only used until trusted publishing is configured on npmjs.com
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish --provenance --access public --tag "$DIST_TAG"
